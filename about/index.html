rgin:0}.voice p{font-size:14px;margin:5px 0}a:focus-visible,input:focus-visible{outline:3px solid #bc000b;outline-offset:4px}@media(max-width:600px){header{align-items:start;font-size:14px}header small{display:block;margin:0}main{margin-top:35px}.lead{font-size:16px}}</style></head><body><header><a href="../">小學者美語 <small>Little Scholar · Since 1997</small></a><a href="../#contact">聯繫我們</a></header><main><a class="back" href="../#about">返回首頁關於小學者區塊</a><h1>關於小學者</h1><h2>​關於我們</h2><p>小學者推行並使用盛行於美國、英國、澳洲、紐西蘭等國家的全語文教學法(Whole Language)，這是一套捨棄一般美語教材零碎且片段的教學方式。</p><p>透過文學作品做為教材，利用文學圖書進行串場引導，透過閱讀欣賞、思考、發表討論與創造的活動課程。讓孩子在輕鬆、有趣的學習中成長。</p><p><a href="https://www.littlescholar-edu.com/" target="_blank" rel="noopener">查看 Wix 官網原頁</a></p></main><footer>小學者美語・Since 1997<br>本頁為網站設計與內容管理示範稿。</footer></body></html>
