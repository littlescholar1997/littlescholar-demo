<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小學者｜響應式預覽</title><style>*{box-sizing:border-box}body{margin:0;background:#e6e9e5;color:#272c29;font:14px/1.5 sans-serif}header{position:sticky;top:0;padding:12px 20px;background:white;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,a{font:inherit;min-height:44px;padding:9px 14px;border:1px solid #ccd3c9;border-radius:5px;background:white;color:inherit;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#bc000b;color:#fff}main{padding:24px;overflow:auto}iframe{display:block;border:0;background:white;height:calc(100dvh - 125px);min-height:500px;max-width:none;margin:auto;box-shadow:0 3px 20px #0002}p{margin:0 auto 0 0}button:focus-visible,a:focus-visible{outline:3px solid #bc000b;outline-offset:3px}</style><header><p>小學者・裝置尺寸預覽</p><button data-width="375" aria-pressed="false">375 手機</button><button data-width="390" aria-pressed="true">390 手機</button><button data-width="768" aria-pressed="false">768 平板</button><button data-width="1024" aria-pressed="false">1024 平板</button><a href="./">開啟完整網站</a></header><main><iframe title="網站響應式預覽" src="./?v=reading-v1" style="width:390px"></iframe></main><script>const frame=document.querySelector("iframe");document.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{frame.style.width=b.dataset.width+"px";document.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}));</script></html>
