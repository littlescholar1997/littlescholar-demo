<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>小學者｜內容管理工作台</title><link rel="stylesheet" href="admin.css"></head><body>
<a class="skip" href="#main">跳至主要內容</a><aside class="sidebar"><a class="identity" href="../"><img src="https://static.wixstatic.com/media/8e4447_83b95dac6d6b4e589752e18169a33d30~mv2.png" alt="小學者美語"><span>Little Scholar <small>Since 1997</small></span></a><p class="workspace-label">內容管理工作台</p><nav aria-label="後台功能"><button data-view="news" class="active">最新消息 <span id="count-news"></span></button><button data-view="teacher">Ling 老師的叮嚀 <span id="count-teacher"></span></button><button data-view="testimonials">學生見證 <span id="count-testimonials"></span></button><button data-view="popup">彈出公告</button><button data-view="settings">網站基本資料</button></nav><div class="sidebar-bottom"><a href="decap.html">Decap 編輯器與正式串接</a><a href="../" target="_blank" rel="noopener">查看網站</a><p>第一階段・介面試用<br>編輯內容只儲存在此瀏覽器。</p></div></aside>
<div class="workspace"><header class="topbar"><span class="top-label">小學者內容工作台</span><div class="top-actions"><button id="import-btn" class="quiet">匯入備份</button><button id="export-btn" class="quiet">匯出全部內容</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></header><div class="mode-note"><strong>介面試用中</strong><span>儲存不會更動網站。正式多人登入與發布尚待串接。</span></div><main id="main"><section class="page-head"><div><p class="eyebrow">把想分享的故事，好好整理。</p><h1 id="view-title">最新消息</h1><p id="view-description">管理講座、招生與課程資訊。</p></div><button id="new-btn" class="primary">＋ 新增消息</button></section><section class="content-surface"><div id="list-area"><div class="filters"><label class="search-label"><span class="sr-only">搜尋內容</span><input id="search" type="search" placeholder="搜尋標題或分類"></label><label class="status-filter"><span class="sr-only">篩選狀態</span><select id="status-filter"><option value="all">所有狀態</option><option value="published">網站既有內容</option><option value="draft">草稿</option><option value="archived">已封存</option></select></label></div><div class="list-caption"><span id="result-count"></span><span>點選內容即可編輯</span></div><div id="content-list" class="content-list" aria-live="polite"></div></div><div id="editor-area" hidden></div></section><p class="save-explanation">此工作台的草稿保留在目前裝置與瀏覽器；跨裝置接手前，請先匯出備份。公開範例資料未含學生聯絡資訊。</p></main></div>
<dialog id="preview-dialog"><div class="dialog-head"><h2>內容預覽</h2><button id="close-preview" class="quiet">關閉預覽</button></div><iframe id="preview-frame" title="內容預覽" sandbox=""></iframe></dialog><dialog id="confirm-dialog"><form method="dialog"><h2>要離開尚未儲存的內容嗎？</h2><p>尚未儲存的修改將不會保留。</p><div class="form-actions"><button value="cancel" class="quiet">繼續編輯</button><button value="discard" class="primary">放棄修改</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="core.js"></script><script src="admin.js"></script></body></html>
