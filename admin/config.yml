backend:
  name: github
  repo: littlescholar1997/littlescholar-demo
  branch: main
# Set base_url/auth_endpoint only after deploying the OAuth service.
# Never put a GitHub client secret or access token in this file.
locale: zh_Hant
site_url: https://littlescholar1997.github.io/littlescholar-demo/
display_url: https://littlescholar1997.github.io/littlescholar-demo/
media_folder: uploads
public_folder: /littlescholar-demo/uploads
collections:
  - name: website
    label: 小學者網站內容
    files:
      - name: site
        label: 文章、見證與網站設定
        file: content/site.json
        format: json
        fields:
          - {label: 資料版本, name: schemaVersion, widget: hidden, default: 1}
          - label: 最新消息與老師文章
            name: posts
            widget: list
            summary: '{{fields.title}}'
            fields:
              - {label: 識別碼, name: id, widget: string, hint: 每則內容請使用不同的小寫英文識別碼}
              - label: 內容區
                name: section
                widget: select
                options: [{label: 最新消息, value: news}, {label: Ling 老師的叮嚀, value: teacher}]
              - {label: 標題, name: title, widget: string}
              - {label: 網址, name: slug, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 請使用小寫英文數字與連字號]}
              - {label: 分類, name: category, widget: string}
              - {label: 發布日期, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, required: false}
              - label: 狀態
                name: status
                widget: select
                default: draft
                options: [{label: 草稿, value: draft}, {label: 公開, value: published}, {label: 封存, value: archived}]
              - {label: 首頁精選, name: featured, widget: boolean, default: false}
              - {label: 封面, name: cover, widget: image, required: false}
              - {label: 圖片說明, name: coverAlt, widget: string, required: false}
              - {label: 摘要, name: summary, widget: text}
              - {label: 內文, name: body, widget: markdown}
              - {label: 原文網址, name: sourceUrl, widget: string, required: false}
              - label: 全文匯入狀態
                name: migration
                widget: select
                options: [{label: 全文完成, value: complete}, {label: 全文待匯入, value: excerpt}]
          - label: 學生見證
            name: testimonials
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {label: 識別碼, name: id, widget: string}
              - {label: 姓名, name: name, widget: string}
              - {label: 學校或學歷, name: school, widget: string}
              - {label: 經歷, name: role, widget: string, required: false}
              - {label: 見證原文, name: quote, widget: text}
              - {label: 排序, name: order, widget: number, value_type: int, min: 0}
              - label: 狀態
                name: status
                widget: select
                options: [draft, published, archived]
              - {label: 照片, name: photo, widget: image, required: false}
              - {label: 照片說明, name: photoAlt, widget: string, required: false}
          - label: 彈出公告
            name: popup
            widget: object
            fields:
              - {label: 啟用, name: enabled, widget: boolean, default: false}
              - {label: 標題, name: title, widget: string, required: false}
              - {label: 內文, name: body, widget: text, required: false}
              - {label: 圖片, name: image, widget: image, required: false}
              - {label: 圖片說明, name: imageAlt, widget: string, required: false}
              - {label: 按鈕文字, name: buttonLabel, widget: string, required: false}
              - {label: 按鈕網址, name: buttonUrl, widget: string, required: false}
              - {label: 開始時間（台灣時間）, name: start, widget: string, required: false, hint: 'YYYY-MM-DDTHH:mm，例如 2026-12-01T09:00'}
              - {label: 結束時間（台灣時間）, name: end, widget: string, required: false}
              - {label: 顯示頻率, name: frequency, widget: select, options: [daily, session, always]}
          - label: 網站基本資料
            name: settings
            widget: object
            fields:
              - {label: 網站名稱, name: name, widget: string}
              - {label: 電話, name: phone, widget: string}
              - {label: 地址, name: address, widget: string}
              - {label: 營業時間, name: hours, widget: text}
