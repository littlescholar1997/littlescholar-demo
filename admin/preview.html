<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小學者 CMS 裝置預覽</title><style>*{box-sizing:border-box}body{margin:0;background:#e6e9e5;color:#29342e;font:14px sans-serif}header{padding:12px 20px;background:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a{padding:10px 14px;min-height:44px;border:1px solid #cbd5c6;background:#fff;border-radius:5px;color:inherit;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#bc000b;color:white}main{padding:22px;overflow:auto}iframe{display:block;width:390px;height:calc(100dvh - 115px);min-height:500px;border:0;background:white;margin:auto;box-shadow:0 2px 20px #0002}</style><header><span style="margin-right:auto">CMS・裝置預覽</span><button data-width="375" aria-pressed="false">375 手機</button><button data-width="390" aria-pressed="true">390 手機</button><button data-width="768" aria-pressed="false">768 平板</button><a href="./">開啟工作台</a></header><main><iframe title="CMS 手機預覽" src="./"></iframe></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})</script></html>
